name: Publication blocked - local reconstruction
"on":
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Reviewed baseline full SHA (not publication permission)
        required: true
        type: string
permissions:
  contents: read
jobs:
  publication-blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed before any credentials or deployment
        run: |
          echo 'Local reconstruction only. No publication authorization, final commit or approved CI evidence.'
          echo 'Reviewed baseline: 26daac7c27d246eaef64bb3f0e59499376993f8f'
          echo 'Recovery requires roll-forward or separately authorized validated backup restoration.'
          exit 1
