name: Julia delivery checks

"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: julia-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify agent traversal, shell and output access without API credentials
        run: |
          mkdir -p work/tools/julia work/tests/Operations julia-input
          cp AGENTS.md work/AGENTS.md
          cp tools/julia/operations.mjs work/tools/julia/operations.mjs
          cp tests/Operations/julia-operations.test.mjs work/tests/Operations/julia-operations.test.mjs
          git -C work init
          printf '{}' > julia-input/task.json
          sudo mkdir -p /opt/julia
          sudo cp tools/julia/task-prompt.md /opt/julia/task-prompt.md
          sudo chmod 444 /opt/julia/task-prompt.md
          bash tools/julia/prepare-agent.sh
          test "$(cat /home/julia/julia-result/preflight.txt)" = accessible
      - name: Verify subprocess tests inside the actual Codex sandbox without a model
        env:
          JULIA_CODEX_VERSION: ${{ vars.JULIA_CODEX_VERSION || '0.167.0' }}
        run: |
          set -euo pipefail
          [[ "$JULIA_CODEX_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --global "@openai/codex@$JULIA_CODEX_VERSION"
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          codex_bin="$(command -v codex)"
          sudo -u julia env HOME=/home/julia XDG_CONFIG_HOME=/home/julia/.config TMPDIR=/tmp \
            /bin/bash -c 'cd /home/julia/work && exec "$1" sandbox linux --permission-profile :workspace -- node --test tests/Operations/julia-operations.test.mjs' _ "$codex_bin"

  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test tests/Operations/julia-operations.test.mjs

  application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Prepare isolated application
        run: |
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          touch database/database.sqlite
          cp .env.example .env
          composer install --no-interaction --prefer-dist
          npm ci
          php artisan key:generate --force
          npm run law:assets:prepare
      - name: Pint on changed PHP files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            git fetch origin main
            BASE_SHA="$(git merge-base HEAD origin/main)"
          fi
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- '*.php')
          if [ "${#files[@]}" -gt 0 ]; then
            vendor/bin/pint --test -- "${files[@]}"
          fi
      - run: php artisan test
      - run: npm run build
      - run: npm run tokens:check
      - run: npm run seo:check
      - run: npm run backoffice:contract:check
