name: Verify publication gate without deployment

"on":
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require manual main context
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
      - name: Checkout exact workflow revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify gate using read-only GitHub context
        env:
          EXPECTED_CANDIDATE: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 deploy/publication_gate.py
