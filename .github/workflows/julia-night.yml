name: Julia autonomous delivery (manual pilot)

"on":
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue autorizada; vazio seleciona a mais antiga disponível'
        required: false
        type: string
  # Ativar somente após o piloto, orçamento e autenticação validados.
  # schedule:
  #   - cron: '0 2 * * *' # 23h America/Bahia (UTC-3)

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.actor == github.repository_owner && github.ref == 'refs/heads/main' &&
    (github.event_name == 'workflow_dispatch' ||
    (github.event_name == 'issue_comment' && github.event.comment.body == '/julia run' && !github.event.issue.pull_request)) &&
    'julia-autonomous-delivery' || format('julia-ignored-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  select:
    if: >-
      github.actor == github.repository_owner && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.comment.body == '/julia run' && !github.event.issue.pull_request))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      selected: ${{ steps.task.outputs.selected }}
      head: ${{ steps.task.outputs.head }}
      main: ${{ steps.task.outputs.main }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Select an explicitly authorized task
        id: task
        env:
          GH_TOKEN: ${{ github.token }}
          JULIA_ISSUE: ${{ inputs.issue }}
        run: node tools/julia/operations.mjs prepare
      - uses: actions/upload-artifact@v4
        if: steps.task.outputs.selected == 'true'
        with:
          name: julia-task
          path: julia-input/task.json
          retention-days: 14
          if-no-files-found: error

  implement:
    needs: select
    if: needs.select.outputs.selected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    permissions:
      contents: read
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@v5
        with:
          path: controller
          persist-credentials: false
      - name: Checkout selected task checkpoint
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.select.outputs.head }}
          path: work
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: julia-task
          path: julia-input
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: Protect controller and verify resumable base
        env:
          MAIN_SHA: ${{ needs.select.outputs.main }}
        run: |
          set -euo pipefail
          cd work
          git config user.name 'Julia Fokus'
          git config user.email 'julia@users.noreply.github.com'
          git -c core.hooksPath=/dev/null merge --no-edit "$MAIN_SHA"
          base_sha="$(git rev-parse HEAD)"
          cd ..
          sudo mkdir -p /opt/julia
          sudo cp controller/tools/julia/operations.mjs /opt/julia/operations.mjs
          sudo cp controller/tools/julia/task-prompt.md /opt/julia/task-prompt.md
          printf '%s' "$base_sha" | sudo tee /opt/julia/base-sha > /dev/null
          sudo chown -R root:root /opt/julia
          sudo chmod -R a-w /opt/julia
      - name: Require configured credentials and pinned runtime
        env:
          HAS_KEY: ${{ secrets.JULIA_OPENAI_API_KEY != '' }}
          MODEL: ${{ vars.JULIA_CODEX_MODEL }}
          CODEX_VERSION: ${{ vars.JULIA_CODEX_VERSION }}
        run: |
          mkdir -p julia-result
          test "$HAS_KEY" = 'true'
          test -n "$MODEL"
          [[ "$CODEX_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Prepare test environment without production credentials
        working-directory: work
        run: |
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          touch database/database.sqlite
          cp .env.example .env
          composer install --no-interaction --prefer-dist
          npm ci
          php artisan key:generate --force
          npm run law:assets:prepare
      - name: Create isolated unprivileged agent account
        run: bash controller/tools/julia/prepare-agent.sh
      - name: Implement and record checkpoint
        id: agent
        timeout-minutes: 180
        continue-on-error: true
        env:
          TMPDIR: /tmp
          XDG_CONFIG_HOME: /home/julia/.config
        uses: openai/codex-action@1d82a3dba7c7988ec71ecae1ed5b8e8db96495c5 # v1
        with:
          openai-api-key: ${{ secrets.JULIA_OPENAI_API_KEY }}
          model: ${{ vars.JULIA_CODEX_MODEL }}
          codex-version: ${{ vars.JULIA_CODEX_VERSION }}
          working-directory: /home/julia/work
          prompt-file: /opt/julia/task-prompt.md
          output-file: /home/julia/julia-result/agent-report.md
          sandbox: workspace-write
          safety-strategy: unprivileged-user
          codex-user: julia
      - name: Capture bounded patch even after agent failure
        if: always() && steps.agent.outcome != '' && steps.agent.outcome != 'skipped'
        working-directory: /home/julia/work
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: |
          sudo chown -R "$(id -un):$(id -gn)" /home/julia/work /home/julia/julia-result
          if [ -f /home/julia/julia-result/agent-report.md ] && [ ! -L /home/julia/julia-result/agent-report.md ]; then
            cp /home/julia/julia-result/agent-report.md "$GITHUB_WORKSPACE/julia-result/agent-report.md"
          fi
          printf '%s' "$AGENT_OUTCOME" > "$GITHUB_WORKSPACE/julia-result/agent-outcome.txt"
          node /opt/julia/operations.mjs bundle /home/julia/julia-input/task.json "$GITHUB_WORKSPACE/julia-result" "$(cat /opt/julia/base-sha)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: julia-result
          path: julia-result/
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [select, implement]
    if: always() && needs.select.outputs.selected == 'true' && needs.implement.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          path: work
          ref: ${{ needs.select.outputs.head }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: julia-task
          path: julia-input
      - uses: actions/download-artifact@v4
        with:
          name: julia-result
          path: julia-result
      - name: Recheck authorization and publish draft PR without executing proposed code
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ../controller/tools/julia/operations.mjs publish ../julia-input/task.json ../julia-result/change.patch
      - name: Report review requirement
        run: |
          echo '### Julia: checkpoint publicado para revisão' >> "$GITHUB_STEP_SUMMARY"
          echo 'PR em rascunho. Sem merge ou deploy. Julia delivery checks foi disparado explicitamente na branch publicada, pois eventos gerados pelo GITHUB_TOKEN não iniciam outros workflows automaticamente. Homologação MySQL/Redis e revisão humana continuam obrigatórias quando aplicáveis.' >> "$GITHUB_STEP_SUMMARY"

  report-failure:
    needs: [select, implement, publish]
    if: always() && needs.select.outputs.selected == 'true' && (needs.implement.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: julia-task
          path: julia-input
      - name: Record blocker and release queue for other tasks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/julia/operations.mjs block julia-input/task.json
