<main class="audit-page fs-container-fluid fs-u-d-flex fs-u-flex-column fs-u-gap-4" data-audit-mode="access">
    <header class="fs-page-header-display"><div><p class="fs-u-fs-overline">Auditoria e segurança</p><h1 class="fs-u-fs-h1">Controle de acessos</h1><p class="fs-u-fs-h5 fs-u-color-secondary">Acessos de clientes e administradores internos registrados nos últimos 30 dias.</p></div><span class="fs-badge fs-badge-soft-info">Retenção: 30 dias</span></header>
    <section class="fs-card fs-card-panel"><form class="fs-filter-form fs-card-body fs-u-d-flex fs-u-flex-wrap fs-u-align-items-end fs-u-gap-3" id="access-filters"><label class="fs-input-group-subtle">Usuário<input class="fs-form-control" name="user" placeholder="Nome ou e-mail"></label><label class="fs-input-group-subtle">Status<select class="fs-form-select" name="status"><option value="">Todos</option><option value="success">Sucesso</option><option value="failed">Falha</option></select></label><label class="fs-input-group-subtle">A partir de<input class="fs-form-control" type="date" name="from"></label><label class="fs-input-group-subtle">Até<input class="fs-form-control" type="date" name="to"></label><button class="fs-btn fs-btn-primary" type="submit">Filtrar</button><button class="fs-btn fs-btn-outline-secondary" type="button" id="access-clear">Limpar</button></form></section>
    <div class="fs-alert" id="access-message" hidden></div>
    <section class="fs-card fs-card-panel"><div class="fs-card-header"><div class="fs-card-header-title"><h2 class="fs-card-title">Últimos acessos</h2><p class="fs-card-subtitle" id="access-summary">Carregando...</p></div></div><div class="fs-card-body fs-u-p-0"><div class="fs-table-responsive"><table class="fs-table fs-table-records fs-table-hover"><thead><tr><th>Usuário</th><th>Empresa</th><th>Produto</th><th>Data e hora</th><th>Status</th><th>Origem</th><th></th></tr></thead><tbody id="access-body"><tr><td colspan="7">Carregando acessos...</td></tr></tbody></table></div></div><div class="fs-card-footer fs-u-d-flex fs-u-flex-wrap fs-u-align-items-center fs-u-justify-content-between"><span id="access-page-summary" class="fs-u-fs-sm fs-u-color-secondary"></span><nav id="access-pagination" aria-label="Paginação do controle de acessos"></nav></div></section>
    <aside class="fs-offcanvas fs-offcanvas-end" id="access-detail" tabindex="-1" aria-labelledby="access-detail-title"><div class="fs-offcanvas-header"><h2 id="access-detail-title" class="fs-offcanvas-title">Detalhes do acesso</h2><button class="fs-btn-close" type="button" data-fs-dismiss="offcanvas" aria-label="Fechar"></button></div><div class="fs-offcanvas-body" id="access-detail-body"></div></aside>
</main>
