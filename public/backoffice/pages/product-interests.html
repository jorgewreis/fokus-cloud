<div class="company-page fs-container-fluid fs-u-d-flex fs-u-flex-column fs-u-gap-4">
    <div class="fs-col fs-u-gap-3 fs-u-mb-3"><h1 class="fs-u-fs-h1">Interesses de produtos</h1><p class="fs-u-fs-h5 fs-u-color-secondary">Diagnósticos recebidos para os produtos da plataforma.</p></div><hr>
    <div id="interest-message" class="fs-alert" role="status" aria-live="polite" hidden></div>
    <form class="fs-form fs-card fs-u-p-3" id="interest-filter-form"><div class="fs-form-row fs-u-align-items-end"><div class="fs-form-col"><label class="fs-form-label" for="interest-product-filter">Produto</label><input class="fs-form-control" id="interest-product-filter" name="product" list="interest-product-options" autocomplete="off" maxlength="120" placeholder="Código do produto"><datalist id="interest-product-options"></datalist><p id="interest-product-error" role="status" aria-live="polite" hidden></p><div class="fs-u-d-flex fs-u-gap-2"><button class="fs-btn fs-btn-outline-primary" id="interest-products-previous" type="button" hidden>Produtos anteriores</button><button class="fs-btn fs-btn-outline-primary" id="interest-products-next" type="button" hidden>Mais produtos</button></div></div><div class="fs-form-col"><label class="fs-form-label" for="interest-profile-filter">Perfil</label><input class="fs-form-control" id="interest-profile-filter" name="profile" placeholder="Ex.: Advocacia"></div><div class="fs-form-col"><label class="fs-form-label" for="interest-status-filter">Status</label><select class="fs-form-select" id="interest-status-filter" name="status"><option value="">Todos</option><option value="novo">Novo</option><option value="contatado">Contatado</option><option value="qualificado">Qualificado</option><option value="arquivado">Arquivado</option></select></div><div class="fs-u-d-flex fs-u-flex-wrap fs-u-justify-content-end fs-u-gap-2"><button class="fs-btn fs-btn-outline-primary" type="submit">Filtrar</button></div></div></form>
    <div class="fs-table-responsive fs-datatable" data-fs="datatable" data-fs-page-size="1000"><table class="fs-table" aria-label="Interesses de produtos"><thead><tr><th>Nome</th><th>E-mail</th><th>Produtos</th><th>Perfil</th><th>Status</th><th>Último envio</th><th></th></tr></thead><tbody id="interest-list"><tr><td colspan="7">Carregando interesses...</td></tr></tbody></table></div><nav id="interest-pagination" class="fs-pagination" aria-label="Paginação de interesses"></nav>
    <section class="fs-card fs-u-p-3" id="interest-detail" hidden aria-live="polite"><div class="fs-u-d-flex fs-u-justify-content-between fs-u-align-items-center fs-u-gap-3"><div class="fs-col fs-u-gap-1"><h2 class="fs-u-fs-h3" id="interest-detail-name"></h2><p class="fs-u-fs-md fs-u-color-secondary" id="interest-detail-email"></p></div><button class="fs-btn fs-btn-outline-primary" id="interest-detail-close" type="button">Fechar</button></div><div id="interest-detail-content" class="fs-col fs-u-gap-2 fs-u-mt-3"></div></section>
</div>
<script>
(() => { const api = window.FokusApi; const state = { page: 1, filters: {} }; const list = document.querySelector("#interest-list"); const pagination = document.querySelector("#interest-pagination"); const message = document.querySelector("#interest-message"); const detail = document.querySelector("#interest-detail"); const root = list.closest("[data-backoffice-mount]") || list.closest(".company-page"); let lifecycle = 0, suspended = false, listRequest = 0, detailRequest = 0; const live = (generation) => root.isConnected && !suspended && generation === lifecycle; let localRestore = false, restoringGeneration = -1; const pause = (event) => { suspended = true; lifecycle++; if (!event.persisted || document.documentElement.hasAttribute("data-company-restore-visibility")) return; localRestore = true; const html = document.documentElement; if (!html.hasAttribute("data-interest-restore-visibility")) { html.dataset.interestRestoreVisibility = html.style.visibility; html.dataset.interestRestoreInert = html.inert ? "1" : "0"; } html.inert = true; html.style.visibility = "hidden"; window.dispatchEvent(new Event("fokus:backoffice-suspend")); }; const resume = async (event) => { if (!event.persisted || !root.isConnected || !localRestore || restoringGeneration === lifecycle) return; const generation = lifecycle; restoringGeneration = generation; const snapshot = (admin) => JSON.stringify({ id: String(admin?.id || ""), role: admin?.role || "", permissions: [...(admin?.permissions || [])].sort() }); const original = window.__backofficeAdmin; let restored; try { const response = await Promise.race([api.request("/backoffice/auth/me"), new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 10000))]); if (!original?.id || !response?.admin?.id || snapshot(original) !== snapshot(response.admin)) throw new Error("identity changed"); restored = response.admin; if (!root.isConnected || generation !== lifecycle) return; const router = window.__backofficeRouter; if (!router?.navigate || !router?.pageFromLocation) throw new Error("router unavailable"); router.admin = restored; window.__backofficeAdmin = restored; window.dispatchEvent(new CustomEvent("fokus:backoffice-revalidated", { detail: restored })); await Promise.race([router.navigate(router.pageFromLocation(), { history: false }), new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 10000))]); if (!router.currentRoot?.isConnected || router.currentRoot.inert) throw new Error("restore failed"); localRestore = false; const html = document.documentElement; html.inert = html.dataset.interestRestoreInert === "1"; html.style.visibility = html.dataset.interestRestoreVisibility || ""; delete html.dataset.interestRestoreInert; delete html.dataset.interestRestoreVisibility; window.dispatchEvent(new Event("fokus:backoffice-resume")); } catch (_) { if (root.isConnected && generation === lifecycle) window.location.reload(); } }; window.addEventListener("pagehide", pause); window.addEventListener("pageshow", resume); const observer = new MutationObserver(() => { if (root.isConnected) return; lifecycle++; observer.disconnect(); window.removeEventListener("pagehide", pause); window.removeEventListener("pageshow", resume); }); observer.observe(root.parentNode, { childList: true }); const esc = (v) => String(v ?? "").replace(/[&<>'"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#039;","\"":"&quot;"}[c])); const status = (v) => `<span class="fs-badge ${v ==="qualificado" ? "fs-badge-soft-success" : v === "arquivado" ? "fs-badge-soft-secondary" : v === "contatado" ? "fs-badge-soft-info" : "fs-badge-soft-warning"}">${esc(v)}</span>`; const show = (v, tone = "danger") => { message.textContent = v || ""; message.dataset.tone = tone; message.hidden = !v; }; const pages = (meta) => { const restoreFocus = pagination.contains(document.activeElement); const current = Number(meta?.current_page) || 1; const last = Math.max(1, Number(meta?.last_page) || 1); const total = Number(meta?.total) || 0; if (last <= 1) { pagination.innerHTML = `<span class="fs-u-fs-sm fs-u-color-secondary">${total} interesses</span>`; return; } const start = Math.max(1, Math.min(current - 2, last - 4)); const numbers = Array.from({ length: Math.min(5, last) }, (_, i) => start + i); const button = (page, label, active = false) => `<li class="fs-page-item${active ? " is-active" : ""}"><button class="fs-page-link" type="button" data-interest-page="${page}"${active ? ' aria-current="page"' : ""}>${label}</button></li>`; pagination.innerHTML = `<span class="fs-u-fs-sm fs-u-color-secondary">Página ${current} de ${last} · ${total} interesses</span><ul class="fs-pagination">${current > 1 ? button(current - 1, "Anterior") : ""}${start > 1 ? button(1, "1") : ""}${numbers.map((page) => button(page, page, page === current)).join("")}${numbers.at(-1) < last ? button(last, last) : ""}${current < last ? button(current + 1, "Próxima") : ""}</ul>`; if (restoreFocus) pagination.querySelector("[aria-current=page]")?.focus(); }; const render = (response) => { list.innerHTML = response.data.length ? response.data.map((item) => `<tr><td data-label="Nome">${esc(item.name)}</td><td data-label="E-mail">${esc(item.email)}</td><td data-label="Produtos">${esc((item.products || []).join(", "))}</td><td data-label="Perfil">${esc((item.profiles || []).join(", "))}</td><td data-label="Status">${status(item.status)}</td><td data-label="Último envio">${new Date(item.last_submitted_at).toLocaleString("pt-BR")}</td><td><button class="fs-btn fs-btn-outline-primary fs-btn-sm" type="button" data-interest-id="${esc(item.id)}">Detalhes</button></td></tr>`).join("") : '<tr><td colspan="7">Nenhum interesse encontrado.</td></tr>'; pages(response.meta); window.refreshFokusDataTables?.(list.closest(".company-page")); }; let optionPage = 1, optionRequest = 0, optionTimer; const productInput = document.querySelector("#interest-product-filter"); const optionsList = document.querySelector("#interest-product-options"); const optionStatus = document.querySelector("#interest-product-error"); const previous = document.querySelector("#interest-products-previous"); const next = document.querySelector("#interest-products-next"); const loadProducts = async () => { const requestId = ++optionRequest, generation = lifecycle; previous.disabled = true; next.disabled = true; try { const params = new URLSearchParams({ q: productInput.value.trim(), page: optionPage }); const response = await api.request(`/backoffice/product-interests-options?${params}`); if (!live(generation) || requestId !== optionRequest) return; optionsList.replaceChildren(); for (const product of response.products) { const option = document.createElement("option"); option.value = product.code; option.label = product.name; optionsList.append(option); } optionPage = response.meta.current_page; previous.hidden = optionPage <= 1; next.hidden = !response.meta.has_more; optionStatus.textContent = response.historical_index_ready ? "" : "O índice de produtos históricos ainda não está pronto. Você pode informar o código manualmente."; optionStatus.hidden = response.historical_index_ready; } catch (error) { if (live(generation) && requestId === optionRequest) { optionsList.replaceChildren(); previous.hidden = true; next.hidden = true; optionStatus.textContent = "Não foi possível carregar sugestões. Você pode informar o código manualmente."; optionStatus.hidden = false; } } finally { if (live(generation) && requestId === optionRequest) { previous.disabled = false; next.disabled = false; } } }; productInput.addEventListener("input", () => { ++optionRequest; clearTimeout(optionTimer); optionsList.replaceChildren(); previous.hidden = true; next.hidden = true; optionPage = 1; optionTimer = setTimeout(loadProducts, 250); }); previous.addEventListener("click", () => { if (optionPage > 1) { optionPage--; loadProducts(); } }); next.addEventListener("click", () => { optionPage++; loadProducts(); }); const load = async () => { const requestId = ++listRequest, generation = lifecycle; try { const params = new URLSearchParams({ page: state.page, per_page: 15, ...state.filters }); const response = await api.request(`/backoffice/product-interests?${params}`); if (!live(generation) || requestId !== listRequest) return; render(response); show(""); } catch (error) { if (live(generation) && requestId === listRequest) show(error.message); } }; const detailHtml = (item) => `<div class="fs-row fs-row-cols-2 fs-u-gap-3"><div><strong>Produtos</strong><p>${esc((item.products || []).join(", "))}</p></div><div><strong>Perfil</strong><p>${esc((item.profiles || []).join(", "))}</p></div><div><strong>Organização</strong><p>${esc(item.organization || "-")}</p></div><div><strong>Localização</strong><p>${esc([item.city, item.state].filter(Boolean).join(" / ") || "-")}</p></div><div><strong>Equipe</strong><p>${esc(item.team_size || "-")}</p></div><div><strong>Capacidade desejada</strong><p>${item.desired_capacity ? `${Number(item.desired_capacity).toLocaleString("pt-BR")} contatos` : "-"}</p></div><div><strong>Maior faixa publicada</strong><p>${item.catalog_max_capacity ? `${Number(item.catalog_max_capacity).toLocaleString("pt-BR")} contatos` : "-"}</p></div><div><strong>Contexto do pedido</strong><p>${esc(item.request_context || "-")}</p></div><div><strong>Consentimento</strong><p>Versão ${esc(item.privacy_version)} · ${new Date(item.consented_at).toLocaleString("pt-BR")}</p></div></div><div><strong>Processo atual</strong><p>${esc(item.current_process || "-")}</p></div><div><strong>Principais dificuldades</strong><p>${esc(item.main_difficulties || "-")}</p></div><div><strong>Módulos</strong><p>${esc((item.modules || []).join(", ") || "-")}</p></div><form id="interest-status-form" class="fs-form-row fs-u-align-items-end"><div class="fs-form-col"><label class="fs-form-label" for="interest-detail-status">Status</label><select class="fs-form-select" id="interest-detail-status" name="status"><option value="novo">Novo</option><option value="contatado">Contatado</option><option value="qualificado">Qualificado</option><option value="arquivado">Arquivado</option></select></div><button class="fs-btn fs-btn-primary" type="submit">Salvar status</button></form>`; document.querySelector("#interest-filter-form").addEventListener("submit", (e) => { e.preventDefault(); state.filters = Object.fromEntries([...new FormData(e.currentTarget)].filter(([, v]) => v)); state.page = 1; load(); }); pagination.addEventListener("click", (e) => { const b = e.target.closest("[data-interest-page]"); if (b) { state.page = Number(b.dataset.interestPage); load(); } }); list.addEventListener("click", async (e) => { const b = e.target.closest("[data-interest-id]"); if (!b) return; const generation = lifecycle, requestId = ++detailRequest; try { const item = (await api.request(`/backoffice/product-interests/${encodeURIComponent(b.dataset.interestId)}`)).interest; if (!live(generation) || requestId !== detailRequest) return; detail.querySelector("#interest-detail-name").textContent = item.name; detail.querySelector("#interest-detail-email").textContent = item.email; detail.querySelector("#interest-detail-content").innerHTML = detailHtml(item); detail.querySelector("#interest-detail-status").value = item.status; detail.hidden = false; detail.dataset.id = item.id; detail.scrollIntoView({ behavior: "smooth" }); } catch (error) { if (live(generation) && requestId === detailRequest) show(error.message); } }); detail.querySelector("#interest-detail-content").addEventListener("submit", async (e) => { if (e.target.id !== "interest-status-form") return; e.preventDefault(); const generation = lifecycle, requestId = detailRequest, id = detail.dataset.id; try { await api.request(`/backoffice/product-interests/${encodeURIComponent(id)}`, { method: "PATCH", body: Object.fromEntries(new FormData(e.target)) }); if (!live(generation) || requestId !== detailRequest) return; show("Status atualizado.", "success"); load(); } catch (error) { if (live(generation) && requestId === detailRequest) show(error.message); } }); detail.querySelector("#interest-detail-close").addEventListener("click", () => { detailRequest++; detail.hidden = true; }); load(); loadProducts(); })();
</script>
