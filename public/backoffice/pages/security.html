<div class="security-page fs-container-fluid fs-u-d-flex fs-u-flex-column fs-u-gap-4">
    <div class="fs-col fs-u-gap-3 fs-u-mb-3">
        <h1 class="fs-u-fs-h1">Seguranca e perfis</h1>
        <p class="fs-u-fs-h5 fs-u-color-secondary">Gerencie contas internas, papeis e eventos de acesso do Backoffice.</p>
    </div>

    <hr>

    <div class="fs-card fs-u-p-3">
        <div class="fs-u-d-flex fs-u-flex-wrap fs-u-justify-content-end fs-u-gap-2">
            <button class="fs-btn fs-btn-primary" id="invite-admin" type="button" data-fs="modal" data-fs-target="#invite-dialog">Convidar administrador</button>
        </div>
    </div>

    <div class="fs-alert" id="security-message" hidden></div>
    <div class="fs-table-responsive fs-datatable" data-fs="datatable" data-fs-page-size="1000">
        <table class="fs-table">
            <thead><tr><th>Administrador</th><th>Perfil</th><th>Status</th><th>Ultimo acesso</th><th>Acoes</th></tr></thead>
            <tbody id="admins-body"></tbody>
        </table>
    </div>
    <div id="invite-dialog" class="fs-modal" tabindex="-1">
        <div class="fs-modal-dialog"><div class="fs-modal-content">
            <div class="fs-modal-header"><h2 class="fs-modal-title" id="invite-dialog-title">Convidar administrador</h2><button class="fs-btn-close" type="button" data-fs-dismiss="modal" aria-label="Fechar"></button></div>
            <form class="fs-form fs-modal-body fs-u-d-flex fs-u-flex-column fs-u-gap-3" id="invite-form" novalidate>
                <label class="fs-form-col fs-form-label" for="invite-admin-name">Nome<input class="fs-form-control" id="invite-admin-name" name="name" required></label>
                <label class="fs-form-col fs-form-label" for="invite-admin-email">E-mail<input class="fs-form-control" id="invite-admin-email" name="email" type="email" required></label>
                <label class="fs-form-col fs-form-label" for="invite-admin-role">Perfil<select class="fs-form-select" id="invite-admin-role" name="role" required><option value="administrador_comercial">Administrador comercial</option><option value="superadministrador">Superadministrador</option></select></label>
                <div class="fs-modal-footer"><button class="fs-btn fs-btn-primary" type="submit">Enviar convite</button><button class="fs-btn fs-btn-outline-primary" id="close-invite" type="button" data-fs-dismiss="modal">Cancelar</button></div>
            </form>
        </div></div>
    </div>
    <script>
        (() => {
            const api = window.FokusApi;
            const body = document.querySelector("#admins-body");
            const notice = document.querySelector("#security-message");
            const dialog = document.querySelector("#invite-dialog");
            const modal = window.FokusStyles?.Modal?.getOrCreateInstance(document.querySelector("#invite-admin"));
            const openDialog = () => { modal?.show(); window.setTimeout(() => document.querySelector("#invite-admin-name")?.focus(), 0); };
            const closeDialog = () => { modal?.hide(); };
            const iconBasePath = "/backoffice/assets/icons/";
            const escapeHtml = (value) => String(value || "").replace(/[&<>"']/g, (character) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[character]);
            const message = (text, tone = "info") => { notice.hidden = false; notice.dataset.tone = tone; notice.textContent = text; };
            const actionButton = (action, id, label, icon, danger = false) => `<button class="fs-btn fs-btn-icon fs-btn-icon-plain fs-table-action${danger ?" fs-btn-danger" : ""}" type="button" data-action="${action}" data-id="${escapeHtml(id)}" title="${label}" aria-label="${label}"><img src="${iconBasePath}${icon}" alt=""></button>`;
            const statusBadge = (status) => { const tone = { ativo: "success", bloqueado: "warning", bloqueio_temporario: "warning", desativado: "secondary" }[status] || "secondary"; return `<span class="fs-badge fs-badge-soft-${tone}">${escapeHtml(status)}</span>`; };
            async function load() {
                try {
                    const [{ admins }, { admin: currentAdmin }] = await Promise.all([api.request("/backoffice/admins"), api.request("/backoffice/auth/me")]);
                    const canManage = (currentAdmin?.permissions || []).includes("platform.security.manage");
                    body.innerHTML = admins.map((admin) => {
                        const isBlocked = ["bloqueado", "bloqueio_temporario"].includes(admin.status);
                        const actions = canManage
                            ? `${isBlocked ? actionButton("unblock", admin.id, "Desbloquear", "Single-Man-Actions-Key--Streamline-Ultimate.png") : admin.status === "ativo" ? actionButton("block", admin.id, "Bloquear", "Single-Man-Actions-Lock--Streamline-Ultimate.png") : ""}${admin.status !== "desativado" ? actionButton("deactivate", admin.id, "Desativar", "Single-Man-Actions-Block--Streamline-Ultimate.png", true) : ""}`
                            : "";
                        return `<tr><td>${escapeHtml(admin.name)}<br><small class="fs-u-color-secondary">${escapeHtml(admin.email)}</small></td><td>${escapeHtml(admin.role)}</td><td>${statusBadge(admin.status)}</td><td>${admin.last_login_at ? new Date(admin.last_login_at).toLocaleString("pt-BR") : "-"}</td><td><div class="fs-u-d-flex fs-u-gap-2">${actions}</div></td></tr>`;
                    }).join("");
                    window.refreshFokusDataTables?.(document.querySelector(".security-page"));
                } catch (error) { message(error.message || "Nao foi possivel carregar as contas internas.", "danger"); }
            }
            document.querySelector("#invite-admin").addEventListener("click", openDialog);
            document.querySelector("#close-invite").addEventListener("click", closeDialog);
            document.addEventListener("keydown", (event) => { if (event.key === "Escape" && modal?.isOpen) closeDialog(); });
            document.querySelector("#invite-form").addEventListener("submit", async (event) => { event.preventDefault(); const form = event.currentTarget; const isValid = window.FokusForm ? FokusForm.validate(form) : form.reportValidity(); if (!isValid) return; FokusForm?.setLoading(form, true); try { const data = await api.request("/backoffice/admins/invitations", { method: "POST", body: Object.fromEntries(new FormData(form)) }); closeDialog(); form.reset(); FokusForm?.clear(form); message(data.message, "success"); load(); } catch (error) { FokusForm?.mapServerErrors(form, error.errors); message(error.message || "Nao foi possivel enviar o convite.", "danger"); } finally { FokusForm?.setLoading(form, false); } });
            body.addEventListener("click", async (event) => { const button = event.target.closest("button[data-action]"); if (!button) return; const reason = prompt("Informe o motivo desta acao:"); if (!reason) return; try { const data = await api.request(`/backoffice/admins/${button.dataset.id}/${button.dataset.action}`, { method: "POST", body: { reason } }); message(data.message, "success"); load(); } catch (error) { message(error.message || "Acao nao permitida.", "danger"); } });
            load();
        })();
    </script>
</div>
