        <script>
        (() => {
            const pageContent = document.querySelector("#page-content");
            const sidebarButtons = document.querySelectorAll(
                "[data-sidebar-item]",
            );
            const pagePath = "./pages";
            const pageVersion = "20260922-module-drawer-controls-v47";
            const routePageMap = {
                painel: "platform-dashboard-final",
                empresas: "companies",
                planos: "subscription-plans",
                catalogo: "products",
                produtos: "products",
                modulos: "modules",
                modules: "modules",
                assinaturas: "subscriptions",
                pagamentos: "pagamentos",
                billing: "pagamentos",
                vouchers: "vouchers",
                seguranca: "security",
                interesses: "product-interests",
                "product-interests": "product-interests",
                componentes: "ui-components",
            };
            const nameParticles = new Set([
                "de",
                "da",
                "do",
                "das",
                "dos",
                "e",
            ]);
            const sidebar = document.querySelector("#sidebar");
            const containerPage = document.querySelector(".container-page");
            const mobileSidebarToggle = document.querySelector(
                ".mobile-sidebar-toggle",
            );
            const mobileSidebarToggleIcon = mobileSidebarToggle.querySelector(
                "img",
            );
            const responsiveSidebarQuery = window.matchMedia(
                "(max-width: 1919px)",
            );
            const sidebarCollapseDelay = 60_000;
            const sidebarRevealDelay = 320;
            const sidebarOpacityDelay = 260;
            const sidebarScaleDelay = 300;
            const sidebarCollapseTransitionDelay = 520;
            let sidebarCollapseTimer;
            let sidebarFooterRevealTimer;
            let sidebarFooterOpacityTimer;
            let sidebarFooterScaleTimer;
            let sidebarCollapseTransitionTimer;
            let sidebarViewportSyncTimer;

            function isSidebarResponsive() {
                return responsiveSidebarQuery.matches;
            }

            function cancelSidebarCollapse() {
                window.clearTimeout(sidebarCollapseTimer);
                sidebarCollapseTimer = undefined;
            }

            function cancelSidebarCollapseTransition() {
                window.clearTimeout(sidebarCollapseTransitionTimer);
                sidebarCollapseTransitionTimer = undefined;
                window.clearTimeout(sidebarFooterScaleTimer);
                sidebarFooterScaleTimer = undefined;
                sidebar.classList.remove("is-collapsing");
            }

            function cancelSidebarFooterReveal() {
                window.clearTimeout(sidebarFooterRevealTimer);
                window.clearTimeout(sidebarFooterOpacityTimer);
                window.clearTimeout(sidebarFooterScaleTimer);
                sidebarFooterRevealTimer = undefined;
                sidebarFooterOpacityTimer = undefined;
                sidebarFooterScaleTimer = undefined;
                sidebar.classList.remove("sidebar-footer-ready");
                sidebar.classList.remove("sidebar-footer-visible");
                sidebar.classList.remove("sidebar-labels-ready");
                sidebar.classList.remove("sidebar-labels-visible");
                sidebar.classList.remove("sidebar-interactive-ready");
            }

            function expandSidebar() {
                if (!isSidebarResponsive()) {
                    return;
                }

                cancelSidebarCollapse();
                cancelSidebarCollapseTransition();
                sidebar.classList.add("expanded");
                sidebar.classList.remove("single");
                if (!sidebar.classList.contains("sidebar-labels-ready")) {
                    cancelSidebarFooterReveal();
                    sidebarFooterRevealTimer = window.setTimeout(() => {
                        sidebar.classList.add("sidebar-footer-ready");
                        sidebar.classList.add("sidebar-labels-ready");
                        sidebarFooterOpacityTimer = window.setTimeout(() => {
                            sidebar.classList.add("sidebar-footer-visible");
                            sidebar.classList.add("sidebar-labels-visible");
                            sidebar.classList.add("sidebar-interactive-ready");
                            sidebarFooterOpacityTimer = undefined;
                        }, sidebarOpacityDelay);
                        sidebarFooterRevealTimer = undefined;
                    }, sidebarRevealDelay);
                } else if (!sidebar.classList.contains("sidebar-labels-visible")) {
                    window.clearTimeout(sidebarFooterOpacityTimer);
                    sidebarFooterOpacityTimer = window.setTimeout(() => {
                        sidebar.classList.add("sidebar-footer-visible");
                        sidebar.classList.add("sidebar-labels-visible");
                        sidebar.classList.add("sidebar-interactive-ready");
                        sidebarFooterOpacityTimer = undefined;
                    }, sidebarOpacityDelay);
                }
                mobileSidebarToggle.setAttribute("aria-expanded", "true");
                mobileSidebarToggle.setAttribute(
                    "aria-label",
                    "Fechar menu lateral",
                );
                mobileSidebarToggleIcon.src =
                    "/backoffice/assets/icons/Sidebar-Expand--Streamline-Ultimate.png?v=20260915-sidebar-icons-v2";
            }

            function collapseSidebar() {
                if (!isSidebarResponsive()) {
                    return;
                }

                const compactCatalogToggle = document.querySelector(
                    '[data-sidebar-group="catalog"] .sidebar-group-toggle',
                );
                const compactCatalogSubnav = document.querySelector(
                    '[data-sidebar-group="catalog"] .sidebar-subnav',
                );
                compactCatalogToggle?.setAttribute("aria-expanded", "false");
                if (compactCatalogSubnav) {
                    compactCatalogSubnav.hidden = true;
                }

                window.clearTimeout(sidebarFooterRevealTimer);
                window.clearTimeout(sidebarFooterOpacityTimer);
                sidebarFooterRevealTimer = undefined;
                sidebarFooterOpacityTimer = undefined;
                sidebar.classList.remove("sidebar-footer-visible");
                sidebar.classList.remove("sidebar-labels-visible");
                sidebar.classList.remove("sidebar-interactive-ready");
                if (window.innerWidth > 700 && sidebar.classList.contains("expanded")) {
                    sidebar.classList.add("is-collapsing");
                    sidebarFooterScaleTimer = window.setTimeout(() => {
                        sidebar.classList.remove("sidebar-footer-ready");
                        sidebar.classList.remove("sidebar-labels-ready");
                        sidebar.classList.remove("sidebar-interactive-ready");
                        sidebarFooterScaleTimer = undefined;
                    }, sidebarScaleDelay);
                    sidebarCollapseTransitionTimer = window.setTimeout(() => {
                        sidebar.classList.add("single");
                        sidebar.classList.remove("expanded");
                        sidebar.classList.remove("sidebar-footer-ready");
                        sidebar.classList.remove("sidebar-labels-ready");
                        sidebar.classList.remove("is-collapsing");
                        sidebarCollapseTransitionTimer = undefined;
                    }, sidebarCollapseTransitionDelay);
                } else {
                    cancelSidebarFooterReveal();
                    sidebar.classList.add("single");
                    sidebar.classList.remove("expanded");
                }
                mobileSidebarToggle.setAttribute("aria-expanded", "false");
                mobileSidebarToggle.setAttribute(
                    "aria-label",
                    "Abrir menu lateral",
                );
                mobileSidebarToggleIcon.src =
                    "/backoffice/assets/icons/Sidebar-Collapes--Streamline-Ultimate.png?v=20260915-sidebar-icons-v2";
            }

            function scheduleSidebarCollapse() {
                if (!isSidebarResponsive()) {
                    return;
                }

                cancelSidebarCollapse();
                sidebarCollapseTimer = window.setTimeout(() => {
                    if (
                        !sidebar.matches(":hover") &&
                        !sidebar.contains(document.activeElement)
                    ) {
                        collapseSidebar();
                    }
                }, sidebarCollapseDelay);
            }

            function syncSidebarToViewport() {
                cancelSidebarCollapse();
                cancelSidebarCollapseTransition();

                if (isSidebarResponsive()) {
                    collapseSidebar();
                    return;
                }

                cancelSidebarFooterReveal();
                sidebar.classList.add("expanded");
                sidebar.classList.remove("single");
                sidebar.classList.add("sidebar-footer-ready");
                sidebar.classList.add("sidebar-labels-ready");
                sidebar.classList.add("sidebar-footer-visible");
                sidebar.classList.add("sidebar-labels-visible");
                sidebar.classList.add("sidebar-interactive-ready");
            }

            function scheduleSidebarViewportSync() {
                window.clearTimeout(sidebarViewportSyncTimer);
                sidebarViewportSyncTimer = window.setTimeout(() => {
                    syncSidebarToViewport();
                    sidebarViewportSyncTimer = undefined;
                }, 120);
            }

            sidebar.addEventListener("mouseenter", expandSidebar);
            sidebar.addEventListener("mouseleave", scheduleSidebarCollapse);
            sidebar.addEventListener("focusin", expandSidebar);
            sidebar.addEventListener("focusout", (event) => {
                if (!sidebar.contains(event.relatedTarget)) {
                    scheduleSidebarCollapse();
                }
            });
            sidebar.addEventListener("pointerdown", (event) => {
                if (!event.target.closest(".mobile-sidebar-toggle")) {
                    expandSidebar();
                }
            });
            sidebar.addEventListener("click", () => {
                if (isSidebarResponsive()) {
                    expandSidebar();
                    scheduleSidebarCollapse();
                }
            });
            mobileSidebarToggle.addEventListener("click", (event) => {
                event.preventDefault();
                event.stopPropagation();

                if (isSidebarResponsive() && window.innerWidth <= 700) {
                    if (sidebar.classList.contains("expanded")) {
                        cancelSidebarCollapse();
                        collapseSidebar();
                    } else {
                        expandSidebar();
                        scheduleSidebarCollapse();
                    }
                }
            });
            document.addEventListener("pointerdown", (event) => {
                if (isSidebarResponsive() && !sidebar.contains(event.target)) {
                    cancelSidebarCollapse();
                    collapseSidebar();
                }
            });
            responsiveSidebarQuery.addEventListener(
                "change",
                syncSidebarToViewport,
            );
            window.addEventListener("resize", scheduleSidebarViewportSync);
            syncSidebarToViewport();

            function formatSidebarAdminName(fullName) {
                const words = String(fullName || "")
                    .trim()
                    .split(/\s+/)
                    .filter(Boolean);

                if (!words.length) {
                    return "";
                }

                const parts = [words[0]];

                for (let index = 1; index < words.length; index += 1) {
                    const word = words[index];
                    const lower = word.toLowerCase();

                    if (nameParticles.has(lower)) {
                        const next = words[index + 1];
                        if (next && !nameParticles.has(next.toLowerCase())) {
                            parts.push(`${word} ${next}`);
                            break;
                        }
                        continue;
                    }

                    parts.push(word);
                    break;
                }

                return parts.join(" ").trim();
            }

            function runPageScripts(container) {
                container.querySelectorAll("script").forEach((script) => {
                    const nextScript = document.createElement("script");
                    nextScript.textContent = script.textContent;
                    script.replaceWith(nextScript);
                });
            }

            function initFokusStylesComponents() {
                const definitions = [
                    ["tooltip", window.FokusStyles?.Tooltip],
                    ["modal", window.FokusStyles?.Modal],
                    ["offcanvas", window.FokusStyles?.Offcanvas],
                    ["datatable", window.FokusStyles?.DataTable],
                    ["pagination", window.FokusStyles?.Pagination],
                    ["select", window.FokusStyles?.Select],
                    ["spinner", window.FokusStyles?.Spinner],
                ];

                definitions.forEach(([name, Constructor]) => {
                    if (Constructor) {
                        window.FokusStyles.core.autoInit(name, Constructor);
                    }
                });
            }

            window.refreshFokusDataTables = function (container = document) {
                container.querySelectorAll?.('[data-fs="datatable"]').forEach((element) => {
                    window.FokusStyles?.DataTable?.getInstance(element)?.refresh();
                });
            };

            async function loadSidebarPage(pageName) {
                if (pageName === "products" && window.__backofficeAdmin?.role !== "superadministrador") {
                    pageName = "companies";
                }
                document.querySelectorAll("link[data-page-css]").forEach((stylesheet) => stylesheet.remove());
                pageContent.innerHTML =
                    '<div class="text-body fs-u-color-secondary">Carregando...</div>';

                try {
                    const response = await fetch(
                        `${pagePath}/${pageName}.html?v=${pageVersion}`,
                    );

                    if (!response.ok) {
                        throw new Error(`Pagina nao encontrada: ${pageName}`);
                    }

                    pageContent.innerHTML = await response.text();
                    window.FokusForm?.enhance(pageContent);
                    initFokusStylesComponents();
                    runPageScripts(pageContent);

                    sidebarButtons.forEach((button) => {
                        button.classList.toggle(
                            "active",
                            button.dataset.sidebarItem === pageName,
                        );
                    });
                } catch (error) {
                    pageContent.innerHTML = "";
                    sidebarButtons.forEach((button) => {
                        button.classList.toggle(
                            "active",
                            button.dataset.sidebarItem === pageName,
                        );
                    });
                    console.error(error);
                }
            }

            window.__adminHeaderNotifications = [];
            const adminHeaderEscape = (value) => String(value ?? "").replace(/[&<>'"]/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#039;","\"":"&quot;"}[char]));
            const adminHeaderDisplayName = (value) => String(value || "Administrador").trim().split(/\s+/).filter(Boolean).slice(0, 2).join(" ") || "Administrador";
            const adminHeaderSetUser = (admin) => {
                const name = String(admin?.name || "Administrador").trim();
                const words = name.split(/\s+/).filter(Boolean);
                document.querySelector("#dashboard-user-name").textContent = adminHeaderDisplayName(name);
                document.querySelector("#dashboard-user-role").textContent = String(admin?.role || "Administrador");
                document.querySelector("#dashboard-user-initials").textContent = words.slice(0, 2).map((word) => word[0]).join("").toUpperCase() || "AD";
            };
            const adminHeaderHideToast = () => {
                const toast = document.querySelector("#admin-header-toast");
                toast.classList.remove("is-visible");
                window.setTimeout(() => { toast.hidden = true; }, 220);
            };
            const adminHeaderShowToast = () => {
                const toast = document.querySelector("#admin-header-toast");
                const content = document.querySelector("#admin-header-toast-content");
                const items = window.__adminHeaderNotifications || [];
                content.innerHTML = items.length
                    ? `<strong>Notificações</strong><ul>${items.map((item) => `<li><b>${adminHeaderEscape(item.label || "Aviso da plataforma")}</b><span>${adminHeaderEscape(item.description || "")}</span></li>`).join("")}</ul>`
                    : `<strong>Notificações</strong><p>Você não tem nenhuma notificação.</p>`;
                toast.hidden = false;
                window.requestAnimationFrame(() => toast.classList.add("is-visible"));
            };
            const adminHeaderSearch = document.querySelector(".admin-global-search input");
            let adminHeaderSearchTimer;
            const adminHeaderLoadSearch = async (value) => {
                const query = value.trim();
                const panel = document.querySelector("#admin-global-search-results");
                if (!query) { panel.hidden = true; return; }
                try {
                    const response = await FokusApi.request(`/backoffice/search?q=${encodeURIComponent(query)}`);
                    const groups = response.groups || [];
                    const items = groups.flatMap((group) => group.items || []);
                    panel.innerHTML = items.length ? groups.filter((group) => group.items?.length).map((group) => `<section><strong>${adminHeaderEscape(group.label)}</strong>${group.items.map((item) => `<a href="${adminHeaderEscape(item.href || "#")}"><span>${adminHeaderEscape(item.title)}</span><small>${adminHeaderEscape(item.subtitle || "")}</small></a>`).join("")}</section>`).join("") : '<p class="admin-global-search-empty">Nenhum resultado encontrado.</p>';
                    panel.hidden = false;
                } catch { panel.hidden = true; }
            };
            adminHeaderSearch.addEventListener("input", (event) => { window.clearTimeout(adminHeaderSearchTimer); adminHeaderSearchTimer = window.setTimeout(() => adminHeaderLoadSearch(event.target.value), 220); });
            adminHeaderSearch.addEventListener("keydown", (event) => { if (event.key === "Escape") { adminHeaderSearch.value = ""; document.querySelector("#admin-global-search-results").hidden = true; } });
            document.querySelector(".admin-notifications-button").addEventListener("click", adminHeaderShowToast);
            document.querySelector(".admin-header-toast-close").addEventListener("click", adminHeaderHideToast);
            const adminHeaderUserDetails = document.querySelector(".admin-user-details");
            const adminHeaderUserMenu = document.querySelector("#admin-user-menu");
            adminHeaderUserDetails.addEventListener("click", () => { const open = adminHeaderUserMenu.hidden; adminHeaderUserMenu.hidden = !open; adminHeaderUserDetails.setAttribute("aria-expanded", String(open)); });
            document.addEventListener("click", (event) => { if (!event.target.closest(".admin-global-search") && !event.target.closest(".admin-global-search-results")) document.querySelector("#admin-global-search-results").hidden = true; if (!event.target.closest(".admin-header-user")) { adminHeaderUserMenu.hidden = true; adminHeaderUserDetails.setAttribute("aria-expanded", "false"); } });
            document.querySelector("[data-dashboard-logout]").addEventListener("click", async () => { await fetch("/backoffice/auth/logout", { method: "POST", credentials: "same-origin" }); location.assign("/backoffice/login"); });
            window.__adminHeaderReady = true;
            const loadAdminHeaderData = async () => {
                const response = await FokusApi.request("/backoffice/dashboard");
                adminHeaderSetUser(response.user);
                window.__adminHeaderNotifications = response.alerts || [];
                document.querySelector(".admin-notifications-button").classList.toggle("has-notifications", window.__adminHeaderNotifications.length > 0);
            };

            sidebarButtons.forEach((button) => {
                button.addEventListener("click", (event) => {
                    event.stopPropagation();
                    loadSidebarPage(button.dataset.sidebarItem);

                    if (isSidebarResponsive()) {
                        cancelSidebarCollapse();
                        collapseSidebar();
                    }
                });
            });

            const catalogGroup = document.querySelector("[data-sidebar-group=\"catalog\"]");
            const catalogToggle = catalogGroup?.querySelector(".sidebar-group-toggle");
            const catalogSubnav = catalogGroup?.querySelector(".sidebar-subnav");
            catalogToggle?.addEventListener("click", (event) => {
                event.preventDefault();
                event.stopPropagation();
                const expanded = catalogToggle.getAttribute("aria-expanded") === "true";
                catalogToggle.setAttribute("aria-expanded", String(!expanded));
                catalogSubnav.hidden = expanded;
                loadSidebarPage("products");
            });

            async function hydrateAdmin() {
                try {
                    const response = await FokusApi.request(
                        "/backoffice/auth/me",
                    );
                        document
                        .querySelectorAll("[data-platform-permission]")
                        .forEach((element) => {
                            element.hidden = !(
                                response?.admin?.permissions || []
                                ).includes(element.dataset.platformPermission);
                        });
                    document
                        .querySelectorAll('[data-platform-role]')
                        .forEach((element) => {
                            element.hidden = response?.admin?.role !== element.dataset.platformRole;
                        });
                    window.__backofficePermissions = new Set(response?.admin?.permissions || []);
                    window.__backofficeAdmin = response.admin;
                    return response.admin;
                } catch (error) {
                    location.replace("/?acesso=administrativo");
                    return null;
                }
            }

            (async () => {
                const admin = await hydrateAdmin();
                if (!admin) return;

                window.__backofficeAuthorized = true;
                document.documentElement.dataset.backofficeAuth = "authorized";
                loadAdminHeaderData().catch(() => {});
                loadSidebarPage(
                    routePageMap[
                        location.pathname.split("/").filter(Boolean).pop()
                    ] || "companies",
                );
            })();
        })();
        </script>
        </template>
        <script>
            (async () => {
                try {
                    const response = await FokusApi.request("/backoffice/auth/me");
                    if (!response?.admin) throw new Error("Não autorizado.");
                    document.documentElement.dataset.backofficeAuth = "authorized";
                    const template = document.querySelector("#backoffice-app-template");
                    const fragment = template.content.cloneNode(true);
                    const scripts = [...fragment.querySelectorAll("script")];
                    document.body.replaceChildren(fragment);
                    scripts.forEach((source) => {
                        const script = document.createElement("script");
                        script.textContent = source.textContent;
                        document.body.appendChild(script);
                    });
                } catch (_) {
                    location.replace("/?acesso=administrativo");
                }
            })();
        </script>
    </body>
</html>
