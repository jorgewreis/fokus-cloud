<!doctype html>
<html lang="pt-BR">
  <head>
    <meta name="robots" content="noindex, nofollow" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assinaturas | Fokus Cloud</title>
    <link rel="stylesheet" href="/assets/css/reset.css" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/subscription.css" />
    <link rel="stylesheet" href="/assets/css/portal.css?v=20260925-portal-shell-v1" />
  <link rel="stylesheet" href="/assets/css/shared/fokus.css?v=20260923-support-mode-v1"></head>
  <body class="subscription-page">
    <main class="checkout-wrap">
      <section class="auth-card">
        <a class="brand" href="/portal">Fokus<span>Cloud</span></a>
        <p>ASSINATURAS DA EMPRESA</p>
        <h1>Assinaturas e pagamentos</h1>
        <p id="message" role="status">Carregando suas assinaturas...</p>
        <div id="subscriptions" class="admin-list"></div>
        <div class="review-actions">
          <p class="card-description">Novas assinaturas de Fokus Law e Fokus Lead estarão disponíveis em breve.</p>
        </div>
      </section>
    </main>
    <script src="/assets/js/fokus.min.js?v=20260916-fokus-styles-2.7.0"></script><script src="/backoffice/assets/js/toast-notifications.js?v=20260922-backoffice-toast-v2"></script><script src="/assets/js/api-client.js"></script>
    <script src="/assets/js/portal-shell.js?v=20260925-law-profile-v2"></script>
    <script>
      const message = document.querySelector('#message');
      const list = document.querySelector('#subscriptions');
      const statusLabels = { aguardando_pagamento: 'Aguardando pagamento', ativa: 'Ativa', suspensa: 'Suspensa', inadimplente: 'Inadimplente', cancelamento_agendado: 'Cancelamento agendado', encerrada: 'Cancelada', cancelada: 'Cancelada' };
      const paymentLabels = { aguardando_pagamento: 'Aguardando pagamento', aprovado: 'Pago', recusado: 'Pagamento recusado', cancelado: 'Cancelado', estornado: 'Estornado', em_disputa: 'Em análise' };
      const conditionLabels = { usage_limit: 'Limite de utilização', plan_code: 'Plano', segment_code: 'Segmento', variant_code: 'Configuração', cycle: 'Ciclo' };
      const cycleLabels = { monthly: 'Mensal', annual: 'Anual' };
      const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
      const hiddenConditions = ['module_code', 'selection_mode', 'context_code', 'collaboration_code', 'collaboration'];
      const formatConditions = (conditions) => Object.entries(conditions || {}).filter(([key, value]) => value !== null && value !== '' && !hiddenConditions.includes(key) && !(key === 'variant_code' && value === 'colaboracao')).map(([key, value]) => `<li>${conditionLabels[key] || key}: <b>${key === 'cycle' ? (cycleLabels[value] || value) : (Array.isArray(value) ? value.join(', ') : value)}</b></li>`).join('');
      (async () => {
        try {
          const subscriptions = await FokusApi.request('/subscriptions');
          if (!subscriptions.length) {
            message.textContent = 'Esta empresa ainda não possui assinaturas.';
            return;
          }
          message.textContent = '';
          list.innerHTML = subscriptions.map((item) => {
            const total = item.payment ? Number(item.payment.amount).toLocaleString('pt-BR', { style: 'currency', currency: item.payment.currency || 'BRL' }) : '—';
            const period = item.current_period_ends_at ? `<p>Vigência até: <b>${new Date(item.current_period_ends_at).toLocaleDateString('pt-BR')}</b></p>` : '';
            const isCanceled = ['encerrada', 'cancelada'].includes(item.status);
            const canCancel = !isCanceled;
            const canDelete = ['encerrada', 'cancelada'].includes(item.status);
            const cancel = canCancel ? `<div class="review-actions"><button class="fs-btn fs-btn-outline-primary" data-cancel="${item.id}" data-type="${item.status === 'aguardando_pagamento' ? 'cancelamento_imediato' : 'cancelamento'}">Cancelar</button></div>` : (item.cancel_at ? `<p class="fs-u-color-danger" style="color:#b42318 !important"><b>Cancelado em ${new Date(item.cancel_at).toLocaleDateString('pt-BR')}</b></p>` : '');
            const remove = canDelete ? `<div class="review-actions"><button class="fs-btn fs-btn-danger" data-delete="${item.id}">Excluir</button></div>` : '';
            const paymentStatus = isCanceled ? 'cancelado' : (item.payment?.status || 'aguardando_pagamento');
            const title = item.display_name || item.public_name || item.product_name;
            const product = `<p>${escapeHtml(item.product_name)}</p>`;
            return `<article class="admin-list-item"><h2 style="font-size:20px !important">${escapeHtml(title)}</h2>${product}<p>Número da assinatura: <b>${escapeHtml(item.id)}</b></p><p>Status da assinatura: <b>${escapeHtml(statusLabels[item.status] || item.status)}</b></p>${period}<p>Status do pagamento: <b>${escapeHtml(paymentLabels[paymentStatus] || paymentStatus)}</b> — ${escapeHtml(total)}</p><h3 style="font-size:16px !important">Módulos e configurações</h3><ul>${item.items.map((entry) => `<li><b>${escapeHtml(entry.name)}</b> (${escapeHtml(entry.quantity)}x)${formatConditions(entry.conditions) ? `<ul>${formatConditions(entry.conditions)}</ul>` : ''}</li>`).join('')}</ul>${cancel}${remove}</article>`;
          }).join('');
          document.querySelectorAll('[data-cancel]').forEach((button) => button.onclick = async () => {
            const prompt = 'O sistema cancelará imediatamente se ainda não houver pagamento. Se a assinatura já estiver vigente, ela permanecerá ativa até o fim do período pago. Deseja continuar?';
            if (!confirm(prompt)) return;
            try { const response = await FokusApi.request(`/subscriptions/${button.dataset.cancel}/change`, { method: 'POST', body: { type: button.dataset.type } }); message.textContent = response.message; location.reload(); } catch (error) { message.textContent = error.message; }
          });
          document.querySelectorAll('[data-delete]').forEach((button) => button.onclick = async () => {
            if (!confirm('Esta ação excluirá definitivamente a assinatura e seus registros relacionados. Deseja continuar?')) return;
            try { const response = await FokusApi.request(`/subscriptions/${button.dataset.delete}`, { method: 'DELETE' }); message.textContent = response.message; location.reload(); } catch (error) { message.textContent = error.message; }
          });
        } catch (error) {
          message.textContent = error.message;
          if (error.message.includes('sessão') || error.message.includes('Unauthenticated')) location.assign('/acesso');
        }
      })();
    </script>
  </body>
</html>
