<!doctype html><html lang="pt-BR" data-theme="light" data-role="user"><head>
    <meta name="robots" content="noindex, nofollow" /><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Empresas | Fokus Cloud</title><link rel="stylesheet" href="/assets/css/reset.css"><link rel="stylesheet" href="/assets/css/style.css"><link rel="stylesheet" href="/assets/css/portal.css?v=20260903-alpha2"><link rel="stylesheet" href="/assets/css/shared/fokus.css?v=20260923-support-mode-v1"></head><body class="portal-page"><main><section class="portal-card"><div class="card-heading"><p class="section-kicker">Contexto de trabalho</p><h1 class="fs-card-title">Escolha a empresa</h1><p class="card-description">Selecione a empresa que será usada nesta sessão.</p></div><div id="companies" class="review-actions"></div><p id="feedback" role="status"></p><a id="login-again" class="fs-btn fs-btn-success" href="/acesso" hidden>Entrar novamente</a></section></main><script src="/assets/js/fokus.min.js?v=20260916-fokus-styles-2.7.0"></script><script src="/backoffice/assets/js/toast-notifications.js?v=20260922-backoffice-toast-v2"></script><script src="/assets/js/api-client.js"></script><script src="/assets/js/portal-shell.js?v=20260923-support-mode-v1"></script><script>(()=>{const feedback=document.querySelector('#feedback');(async()=>{try{const me=await FokusApi.request('/auth/me');if(!me.companies.length)throw new Error('Nenhuma empresa ativa está disponível para esta conta.');companies.innerHTML=me.companies.map(c=>`<button class="fs-btn fs-btn-outline-primary" data-id="${c.id}">${c.name} — ${c.role}</button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{try{await FokusApi.request('/auth/select-company',{method:'POST',body:{company_id:b.dataset.id}});location.assign('/portal')}catch(error){feedback.textContent=error.message}})}catch(error){feedback.textContent=error.message||'Sua sessão não está disponível.';document.querySelector('#login-again').hidden=false}})()})()</script></body></html>
