<!doctype html><html lang="pt-BR" data-theme="light" data-role="user"><head>
    <meta name="robots" content="noindex, nofollow" /><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Empresas | Fokus Cloud</title><link rel="stylesheet" href="/assets/css/portal.css?v=20260925-portal-shell-v1"><link rel="stylesheet" href="/assets/css/shared/fokus.css?v=20261009-select-menu-options-v1"></head><body class="portal-page"><main><section class="portal-card"><div class="card-heading"><p class="section-kicker">Contexto de trabalho</p><h1 class="fs-card-title">Escolha a empresa</h1><p class="card-description">Selecione a empresa que será usada nesta sessão.</p></div><div id="companies" class="review-actions"></div><p id="feedback" role="status"></p><a id="continue-portal" class="fs-btn fs-btn-primary" href="/portal" hidden>Continuar para o portal</a><a id="login-again" class="fs-btn fs-btn-success" href="/acesso" hidden>Entrar novamente</a></section></main><script src="/assets/js/fokus.min.js?v=20260916-fokus-styles-2.7.0"></script><script src="/backoffice/assets/js/toast-notifications.js?v=20260922-backoffice-toast-v2"></script><script src="/assets/js/api-client.js"></script><script src="/assets/js/portal-shell.js?v=20261008-primary-outline-buttons-v1"></script><script>(()=>{const feedback=document.querySelector('#feedback'),continuePortal=document.querySelector('#continue-portal');let selecting=false,selected=false;(async()=>{try{const me=await FokusApi.request('/auth/me');if(!me.companies.length)throw new Error('Nenhuma empresa ativa está disponível para esta conta.');const buttons=document.createDocumentFragment();me.companies.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='fs-btn fs-btn-outline-primary';b.dataset.id=c.id;b.textContent=`${c.name} — ${c.role}`;b.onclick=async()=>{if(selecting||selected)return;selecting=true;feedback.textContent='Selecionando empresa...';companies.setAttribute('aria-busy','true');companies.querySelectorAll('button').forEach(button=>{button.disabled=true});try{await FokusApi.request('/auth/select-company',{method:'POST',body:{company_id:b.dataset.id}})}catch(error){selecting=false;companies.setAttribute('aria-busy','false');companies.querySelectorAll('button').forEach(button=>{button.disabled=false});feedback.textContent=error?.message||'Não foi possível selecionar a empresa.';if(document.activeElement===document.body||companies.contains(document.activeElement))b.focus();return}selected=true;selecting=false;companies.setAttribute('aria-busy','false');feedback.textContent='Empresa selecionada. Continue para o portal.';continuePortal.hidden=false;if(document.activeElement===document.body||companies.contains(document.activeElement))continuePortal.focus();try{location.assign('/portal')}catch(error){}};buttons.append(b)});companies.replaceChildren(buttons)}catch(error){feedback.textContent=error.message||'Sua sessão não está disponível.';document.querySelector('#login-again').hidden=false}})()})()</script></body></html>
