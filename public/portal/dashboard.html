<!doctype html><html lang="pt-BR" data-theme="light" data-role="user"><head>
    <meta name="robots" content="noindex, nofollow" /><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visão geral | Fokus Cloud</title><link rel="stylesheet" href="/assets/css/reset.css"><link rel="stylesheet" href="/assets/css/style.css"><link rel="stylesheet" href="/assets/css/portal.css?v=20260925-portal-shell-v1"><link rel="stylesheet" href="/assets/css/shared/fokus.css?v=20260923-support-mode-v1"></head><body class="portal-page"><main><section class="portal-card"><div class="portal-section-title">Resumo da empresa</div><p id="message" class="portal-empty">Carregando informações da sua conta...</p><div class="portal-grid"><article class="portal-metric"><span>Assinaturas ativas</span><strong id="subscriptions">—</strong></article><article class="portal-metric"><span>Seu perfil</span><strong id="role">—</strong></article><article class="portal-metric"><span>Próxima cobrança</span><strong id="renewal">—</strong></article><article class="portal-metric"><span>Ações disponíveis</span><strong id="actions">—</strong></article></div></section><section class="portal-card portal-section"><h2 class="portal-section-title">Atalhos</h2><div class="review-actions"><a class="fs-btn fs-btn-success" href="/portal/assinaturas">Gerenciar assinaturas</a><a class="fs-btn fs-btn-outline-primary" href="/portal/usuarios">Gerenciar usuários</a><a class="fs-btn fs-btn-outline-primary" href="/portal/perfil">Atualizar perfil</a></div></section></main><script src="/assets/js/fokus.min.js?v=20260916-fokus-styles-2.7.0"></script><script src="/backoffice/assets/js/toast-notifications.js?v=20260922-backoffice-toast-v2"></script><script src="/assets/js/api-client.js"></script><script src="/assets/js/portal-shell.js?v=20260923-support-mode-v1"></script><script>(async()=>{try{const me=await FokusApi.request('/auth/me');if(!me.user.email_verified){location='/verificar-email';return}if(!me.active_company_id){location='/portal/empresas';return}const company=me.companies.find(c=>c.id===me.active_company_id);role.textContent=company?.role==='admin'?'Administrador':'Usuário';actions.textContent=company?.role==='admin'?'Gestão completa':'Perfil e produtos';const subs=await FokusApi.request('/subscriptions');subscriptions.textContent=subs.filter(s=>s.status==='ativa').length;const next=subs.filter(s=>s.current_period_ends_at).sort((a,b)=>new Date(a.current_period_ends_at)-new Date(b.current_period_ends_at))[0];renewal.textContent=next?new Date(next.current_period_ends_at).toLocaleDateString('pt-BR'):'—';if(company?.role!=='admin')document.querySelector('a[href="/portal/usuarios"]').hidden=true;message.textContent=company?`Empresa ativa: ${company.name}`:'Nenhuma empresa selecionada'}catch(e){message.textContent=e.message;setTimeout(()=>location='/acesso',900)}})()</script></body></html>
