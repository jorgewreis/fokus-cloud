<!doctype html>
<html lang="pt-BR">
  <head>
    <meta name="robots" content="noindex, nofollow" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Usuários | Fokus Cloud</title>
    <link rel="stylesheet" href="/assets/css/reset.css" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/subscription.css" />
    <link rel="stylesheet" href="/assets/css/portal.css?v=20260925-portal-shell-v1" />
  <link rel="stylesheet" href="/assets/css/shared/fokus.css?v=20260923-support-mode-v1"></head>
  <body class="subscription-page">
    <main class="checkout-wrap">
      <section class="auth-card">
        <a class="brand" href="/portal">Fokus<span>Cloud</span></a>
        <div class="card-heading">
          <p class="section-kicker">Usuários da empresa</p>
          <h1 class="fs-card-title">Convide e administre acessos</h1>
          <p class="card-description">Defina o perfil de cada pessoa que acessa a sua empresa.</p>
        </div>
        <form id="invite-form">
          <label class="form-field"><span class="fs-form-label">Nome completo</span><input class="field-size-md" name="name" autocomplete="name" required /></label>
          <label class="form-field"><span class="fs-form-label">CPF</span><input class="field-size-md" name="cpf" inputmode="numeric" required /></label>
          <label class="form-field"><span class="fs-form-label">E-mail</span><input class="field-size-md" name="email" type="email" autocomplete="email" required /></label>
          <label class="form-field"><span class="fs-form-label">Perfil</span><select class="field-size-md" name="role"><option value="usuario">Usuário</option><option value="gestor">Gestor</option></select></label>
        </form>
        <div class="login-actions"><button class="fs-btn fs-btn-success" form="invite-form" type="submit">Enviar convite</button></div>
        <p id="message" class="form-message" role="status"></p>
        <div class="review-actions"><a class="fs-btn fs-btn-outline-primary" href="/portal/transferir-administracao">Transferir administração</a></div>
        <div id="users" class="admin-list"></div>
      </section>
    </main>
    <script src="/assets/js/fokus.min.js?v=20260916-fokus-styles-2.7.0"></script><script src="/backoffice/assets/js/toast-notifications.js?v=20260922-backoffice-toast-v2"></script><script src="/assets/js/api-client.js"></script>
    <script src="/assets/js/portal-shell.js?v=20260923-support-mode-v1"></script>
    <script>
      const message = document.querySelector('#message');
      const list = document.querySelector('#users');
      const digits = (value) => value.replace(/\D/g, '');
      const validCpf = (value) => {
        const cpf = digits(value);
        if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
        const check = (length) => {
          const total = cpf.slice(0, length).split('').reduce((sum, digit, index) => sum + Number(digit) * (length + 1 - index), 0);
          const digit = (total * 10) % 11;
          return digit === 10 ? 0 : digit;
        };
        return check(9) === Number(cpf[9]) && check(10) === Number(cpf[10]);
      };
      const maskCpf = (value) => `${value.slice(0, 3)}.***.***-${value.slice(-2)}`;
      async function load() {
        try {
          const users = await FokusApi.request('/portal/users');
          list.innerHTML = users.map((user) => `<article class="admin-list-item"><h2>${user.name}</h2><p>${maskCpf(user.cpf)} · ${user.email} · ${user.role} · <b>${user.status}</b></p>${user.role === 'admin' ? '' : `<div class="review-actions"><button class="fs-btn fs-btn-secondary" data-action="gestor" data-id="${user.id}" data-version="${user.version}">Gestor</button><button class="fs-btn fs-btn-secondary" data-action="usuario" data-id="${user.id}" data-version="${user.version}">Usuário</button>${user.status === 'removido' ? `<button class="fs-btn fs-btn-secondary" data-action="restore" data-id="${user.id}" data-version="${user.version}">Restaurar</button>` : `<button class="fs-btn fs-btn-outline-primary" data-action="${user.status === 'suspenso' ? 'ativo' : 'suspenso'}" data-id="${user.id}" data-version="${user.version}">${user.status === 'suspenso' ? 'Reativar' : 'Suspender'}</button><button class="fs-btn fs-btn-outline-primary" data-action="removido" data-id="${user.id}" data-version="${user.version}">Remover</button>`}</div>`}</article>`).join('');
          list.querySelectorAll('[data-action]').forEach((button) => button.onclick = async () => {
            const action = button.dataset.action;
            try {
              const response = action === 'restore'
                ? await FokusApi.request(`/portal/users/${button.dataset.id}/restore`, { method: 'POST', body: { version: Number(button.dataset.version) } })
                : await FokusApi.request(`/portal/users/${button.dataset.id}`, { method: 'PATCH', body: action === 'gestor' || action === 'usuario' ? { role: action, version: Number(button.dataset.version) } : { status: action, version: Number(button.dataset.version) } });
              message.textContent = response.message;
              load();
            } catch (error) { message.textContent = error.message; }
          });
        } catch (error) {
          message.textContent = error.message;
          location.assign('/acesso');
        }
      }
      document.querySelector('#invite-form').onsubmit = async (event) => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(event.currentTarget));
        if (!validCpf(data.cpf)) {
          event.currentTarget.elements.cpf.value = '';
          message.textContent = 'CPF inválido. Informe novamente.';
          return;
        }
        try {
          const response = await FokusApi.request('/portal/users', { method: 'POST', body: data });
          message.textContent = response.message;
          event.currentTarget.reset();
          load();
        } catch (error) { message.textContent = error.message; }
      };
      load();
    </script>
  </body>
</html>
