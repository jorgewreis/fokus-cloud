<!doctype html>
<html lang="pt-BR">
  <head>
    <meta name="robots" content="noindex, nofollow" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transferir administração | Fokus Cloud</title>
    <link rel="stylesheet" href="/assets/css/reset.css" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/subscription.css" />
    <link rel="stylesheet" href="/assets/css/portal.css?v=20260903-alpha2" />
  <link rel="stylesheet" href="/assets/css/shared/fokus.css?v=20260923-support-mode-v1"></head>
  <body class="subscription-page">
    <main class="checkout-wrap">
      <section class="auth-card">
        <a class="brand" href="/portal/usuarios">Fokus<span>Cloud</span></a>
        <div class="card-heading">
          <p class="section-kicker">Administração da empresa</p>
          <h1 class="fs-card-title">Transferir administração</h1>
          <p class="card-description">O novo administrador deve possuir vínculo ativo e e-mail confirmado. A confirmação será enviada por e-mail.</p>
        </div>
        <form id="transfer-form">
          <label class="form-field"><span class="fs-form-label">Novo administrador</span><select class="field-size-md" id="membership" name="membership_id" required></select></label>
          <label class="form-field"><span class="fs-form-label">Sua senha atual</span><input class="field-size-md" name="password" type="password" autocomplete="current-password" required /></label>
          <label class="consent-field"><input name="keep_previous_access" type="checkbox" value="1" /><span>Manter meu acesso como usuário comum após a transferência.</span></label>
        </form>
        <div class="login-actions"><button class="fs-btn fs-btn-success" form="transfer-form" type="submit">Enviar aceite de transferência</button></div>
        <p id="message" class="form-message" role="status"></p>
        <h2>Histórico de administração</h2>
        <div id="history" class="admin-list"></div>
      </section>
    </main>
    <script src="/assets/js/fokus.min.js?v=20260916-fokus-styles-2.7.0"></script><script src="/backoffice/assets/js/toast-notifications.js?v=20260922-backoffice-toast-v2"></script><script src="/assets/js/api-client.js"></script>
    <script src="/assets/js/portal-shell.js?v=20260923-support-mode-v1"></script>
    <script>
      const form = document.querySelector('#transfer-form');
      const message = document.querySelector('#message');
      (async () => {
        try {
          const users = await FokusApi.request('/portal/users');
          document.querySelector('#membership').innerHTML = users.filter((user) => user.role !== 'admin' && user.status === 'ativo' && user.email_verified_at).map((user) => `<option value="${user.id}">${user.name} — ${user.role}</option>`).join('');
          const history = await FokusApi.request('/portal/audit-history');
          document.querySelector('#history').innerHTML = history.length ? history.map((entry) => `<article class="admin-list-item"><p><b>${entry.operation}</b> em ${new Date(entry.created_at).toLocaleString('pt-BR')}</p><p>${entry.after_masked || entry.before_masked || ''}</p></article>`).join('') : '<p>Nenhum evento de administração registrado.</p>';
        } catch (_) { location.assign('/acesso'); }
      })();
      form.onsubmit = async (event) => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(form));
        data.keep_previous_access = Boolean(form.elements.keep_previous_access.checked);
        try {
          const response = await FokusApi.request('/portal/transfer-admin', { method: 'POST', body: data });
          message.textContent = response.message;
          form.reset();
        } catch (error) { message.textContent = error.message; }
      };
    </script>
  </body>
</html>
