# Add inside the HTTPS server block in CloudPanel. Keep the existing CloudPanel
# macros, root, logs, Varnish location and the current PHP/static locations.
# After law.fokuscloud.com.br resolves to this vhost and has a valid TLS
# certificate, send the product alias to the canonical authenticated entry.
if ($host = law.fokuscloud.com.br) { return 302 https://www.fokuscloud.com.br/produtos/fokus-law$is_args$args; }

add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

# Do not serve the physical Backoffice HTML file through Varnish. Preserve the
# original request URI while passing the request directly to the PHP listener.
location = /backoffice { try_files /__fokus_backoffice_guard__ @fokuscloud_backoffice; }
location = /backoffice/ { try_files /__fokus_backoffice_guard__ @fokuscloud_backoffice; }
location = /backoffice/index.html { try_files /__fokus_backoffice_guard__ @fokuscloud_backoffice; }

location @fokuscloud_backoffice {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
}

# Prevent duplicate headers from Laravel; the HTTPS server supplies HSTS/CSP
# and /etc/nginx/global_settings supplies nosniff/frame/referrer for app routes.
# Add these lines inside the existing location / block.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;

# The existing static regex location has add_header Access-Control-Allow-Origin,
# which stops NGINX inheriting server headers. Add these directives there too.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;

# Add inside the port 8080 server block before its server-level try_files.
# Route the Backoffice shell to Laravel's front controller even when the
# physical public/backoffice/index.html file exists.
location = /backoffice { try_files /__fokus_backoffice_guard__ @fokuscloud_backoffice_frontcontroller; }
location = /backoffice/ { try_files /__fokus_backoffice_guard__ @fokuscloud_backoffice_frontcontroller; }
location = /backoffice/index.html { try_files /__fokus_backoffice_guard__ @fokuscloud_backoffice_frontcontroller; }

location @fokuscloud_backoffice_frontcontroller {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param HTTPS on;
    fastcgi_param SERVER_PORT 443;
    fastcgi_param PHP_VALUE "{{php_settings}}";
    fastcgi_intercept_errors on;
    fastcgi_read_timeout 3600;
    fastcgi_send_timeout 3600;
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};
}

# Preserve existing public legacy redirects in the HTTPS server.
location = /index.html { return 301 /; }
location = /src/pages/ { return 301 /produtos/fokus-law#planos; }
location = /src/pages/fokus-law.html { return 301 /produtos/fokus-law; }
location = /src/pages/fokus-lead.html { return 301 /produtos/fokus-lead; }
location = /src/pages/fokus-law-assinatura.html { return 301 /assinaturas/fokus-law; }
location = /src/pages/fokus-lead-assinatura.html { return 301 /assinaturas/fokus-lead; }
location = /auth/cadastro.html { return 301 /cadastro$is_args$args; }
location = /auth/verificar-email.html { return 301 /verificar-email$is_args$args; }
location = /auth/criar-senha.html { return 301 /criar-senha$is_args$args; }
location = /auth/aceitar-vinculo.html { return 301 /aceitar-vinculo$is_args$args; }
location = /auth/aceitar-transferencia.html { return 301 /aceitar-transferencia$is_args$args; }
location = /admin { return 301 /acesso; }
location = /admin/ { return 301 /acesso; }
location = /admin/painel { return 301 /portal; }
location = /admin/perfil { return 301 /portal/perfil; }
location = /admin/empresas { return 301 /portal/empresas; }
location = /admin/usuarios { return 301 /portal/usuarios; }
location = /admin/assinaturas { return 301 /portal/assinaturas; }
location = /admin/transferir-administracao { return 301 /portal/transferir-administracao; }
location = /admin/empresas.html { return 301 /portal/empresas; }
location = /admin/usuarios.html { return 301 /portal/usuarios; }
location = /admin/assinaturas.html { return 301 /portal/assinaturas; }
